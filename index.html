    <!-- View 1: Game -->
    <section id="view-game" class="tab-view active" role="tabpanel" aria-labelledby="tab-game">
      <main class="game-main">
        <div class="arcade-cabinet">
          <!-- Canvas Frame -->
          <div class="canvas-wrapper" id="canvas-container">
            <canvas id="game-canvas" width="800" height="520" tabindex="0"></canvas>
          </div>

          <!-- Controls & Status Bar below Canvas -->
          <footer class="game-toolbar">
            <div class="toolbar-section controls-hint">
              <span class="section-label">Movimiento:</span>
              <div class="key-group">
                <kbd class="key-badge">W</kbd>
                <kbd class="key-badge">A</kbd>
                <kbd class="key-badge">S</kbd>
                <kbd class="key-badge">D</kbd>
              </div>
              <span class="hint-text">(o Flechas)</span>
            </div>

            <div class="toolbar-section interaction-hint">
              <span class="section-label">Acción:</span>
              <div class="key-group">
                <kbd class="key-badge key-action">E</kbd>
                <span class="hint-text">Interactuar</span>
              </div>
            </div>

          </footer>
        </div>

        <!-- Sidebar / Inspection Panel -->
        <aside class="features-sidebar" id="features-sidebar">
          <div id="sidebar-default-content" class="sidebar-default-content">
            <span class="section-label">Inventario:</span>
            <div class="inventory-slots" id="inventory-display">
              <div class="inventory-slot empty" id="slot-key" title="Ranura de Llave">
                <span class="slot-icon">🗝️</span>
                <span class="slot-label">Sin Llaves</span>
              </div>
            </div>
          </div>
          <div id="sidebar-minigame-container" class="sidebar-minigame-container" style="display: none;"></div>
        </aside>
      </main>
    </section>

    <!-- View 2: Global Map Overview & Object Inspector -->
    <section id="view-map" class="tab-view" role="tabpanel" aria-labelledby="tab-map">
      <div id="map-inspector-mount"></div>
    </section>

    <!-- View 3: Tile Studio / MS Paint XP -->
    <section id="view-paint" class="tab-view" role="tabpanel" aria-labelledby="tab-paint">
      <div id="tile-studio-mount"></div>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
